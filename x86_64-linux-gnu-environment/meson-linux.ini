[binaries]
c = '@TRIPLE@-gcc'
cpp = '@TRIPLE@-g++'
ar = '@TRIPLE@-ar'
strip = '@TRIPLE@-strip'
pkg-config = '@TRIPLE@-pkg-config'
exe_wrapper = ['@QEMU@', '-L', '/usr/@TRIPLE@']

[host_machine]
system = 'linux'
cpu_family = '@CPU_FAMILY@'
cpu = '@CPU@'
endian = 'little'

[properties]
needs_exe_wrapper = true
